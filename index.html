<html lang="fr" class="scroll-smooth">

      rel="stylesheet"
    />

    <!-- Titre et métadonnées SEO -->
    <title>Ikram Raboudi — Développeuse Web & Mobile | Recherche Stage PFE 2027</title>
    <meta
      name="description"
      content="Étudiante en 3e année de Licence en Technologies de l'Informatique (Développement des Systèmes d'Information) à l'ISET Kélibia, animée par un vif intérêt pour les nouvelles technologies et le développement logiciel. Recherche un stage PFE de février à mai 2027."
    />
    <meta name="author" content="Ikram Raboudi" />
    <meta name="keywords" content="Ikram Raboudi, Développeuse Web, Développeuse Mobile, Flutter, Symfony, Go, DSI, ISET Kélibia, Stage PFE 2027, Portfolio, Tunisie" />

    <!-- Open Graph / Réseaux sociaux -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Ikram Raboudi — Développeuse Web & Mobile | Portfolio" />
    <meta
      property="og:description"
      content="Étudiante en 3e année de Licence en Technologies de l'Informatique (Développement des Systèmes d'Information) à l'ISET Kélibia. Recherche un stage PFE de février à mai 2027 pour contribuer à des projets innovants."
    />
    <meta property="og:image" content="/assets/avatar.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ikram Raboudi — Développeuse Web & Mobile" />
    <meta
      name="twitter:description"
      content="Étudiante en 3e année de Licence en Technologies de l'Informatique (Développement des Systèmes d'Information) à l'ISET Kélibia. Recherche un stage PFE de février à mai 2027."
    />
    <meta name="twitter:image" content="/assets/avatar.jpg" />

    <!-- Données structurées JSON-LD (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ikram Raboudi",
        "jobTitle": "Développeuse Web & Mobile",
        "description": "Étudiante en 3e année de Licence en Technologies de l'Informatique (Développement des Systèmes d'Information) à l'ISET Kélibia, animée par un vif intérêt pour les nouvelles technologies et le développement logiciel. Je maîtrise Flutter, Symfony, PHP, Java et Python, et j'ai conçu des applications web et mobiles complètes. Je recherche un stage PFE de février à mai 2027 pour contribuer à des projets innovants au sein d'une équipe agile.",
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "ISET Kélibia"
        },
        "knowsLanguage": ["ar", "fr", "en"],
        "sameAs": [
          "https://github.com/ikramraboudi",
          "https://www.linkedin.com/in/ikram-raboudi-796803332/"
        ]
      }
    </script>

    <!-- Thème initial pour éviter le flash blanc en mode sombre -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-light text-content-mainLight dark:bg-bg-dark dark:text-content-mainDark transition-colors duration-300 font-sans antialiased selection:bg-rose-powder/30 selection:text-denim-700 dark:selection:bg-denim-400/30 dark:selection:text-denim-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
